server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "governance.demo"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # join_token node attestation: the simplest node-attestation method, meant
    # for demos/small deployments with one node (docs.spiffe.io/join-token).
    # A production multi-node deployment would use a cloud/platform attestor
    # (aws_iid, k8s_psat, ...) instead.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}
